name: release

# Push a tag, get a release. Nothing else to remember, and nothing that can be
# done differently by hand from one release to the next - the last two got
# their completion assets uploaded under the wrong names, which the installer
# only stopped hiding once its fallback was removed.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0          # the tag message is the release body

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - run: ./test

      - name: Stamp the version from the tag
        run: |
          # The tag is the only place a version number is written down. The
          # file in the repo carries a dev marker, so a copy taken from a
          # checkout cannot claim to be a release it is not.
          version="${GITHUB_REF_NAME#v}"
          grep -q '^__version__ = "0.0.0+dev"' ferry || {
            echo "ferry has a version already - it should carry the dev marker" >&2
            exit 1
          }
          sed -i "s/^__version__ = .*/__version__ = \"$version\"/" ferry
          said="$(python3 ferry --version | awk '{print $2}')"
          [ "$said" = "$version" ] || {
            echo "stamped $version but ferry says $said" >&2; exit 1; }
          echo "ferry $said"

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Assets are named by their paths in the repo, so one cannot end up
          # called something else because of how the command was typed that
          # day - which is how v1.2.5 and v1.2.6 got f.bash and f.zsh.
          #
          # Notes come from the tag: its own message when annotated, and the
          # tagged commit's message when lightweight. Either is something
          # already written down rather than composed at release time.
          notes="$(git tag -l --format='%(contents)' "$GITHUB_REF_NAME")"
          [ -n "$notes" ] || notes="See the commit log for what changed."
          printf '%s\n' "$notes" > notes.md
          gh release create "$GITHUB_REF_NAME" \
            ferry completions/ferry.bash completions/ferry.zsh \
            skills/ferry/SKILL.md \
            --title "ferry ${GITHUB_REF_NAME#v}" \
            --notes-file notes.md
